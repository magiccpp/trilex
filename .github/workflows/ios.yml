name: iOS

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]

jobs:
  core:
    # The shared core, on both platforms: Linux proves it stays portable,
    # macOS runs the CryptoKit and Compression (xz) paths the phone uses.
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: SQLite headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Test TrilexKit
        run: swift test --package-path ios/TrilexKit

  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build for the simulator
        run: |
          xcodebuild -project ios/Trilex.xcodeproj -scheme Trilex \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug CODE_SIGNING_ALLOWED=NO build
