# Add this INSIDE the `server { ... server_name xiaodong.io; listen 443 ssl; }`
# block of /home/ken/git/stock-orch/nginx/conf.d/default.conf
# (place it next to the existing `location /api/` block).
#
# The trailing slash on proxy_pass strips the prefix, so a request to
#   https://xiaodong.io/thriauga/v1/health
# reaches the container as
#   /v1/health

    location /thriauga/ {
        proxy_pass http://thriauga-sync:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        client_max_body_size  8m;
    }
