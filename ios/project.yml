# XcodeGen spec for the iPhone app. Generate the Xcode project with:
#
#     brew install xcodegen
#     cd ios && xcodegen generate && open Trilex.xcodeproj
#
# The project file is generated, not committed, so it never conflicts.
name: Trilex
options:
  bundleIdPrefix: io.xiaodong
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  TrilexKit:
    path: TrilexKit
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Trilex:
    type: application
    platform: iOS
    sources:
      - path: Trilex/Sources
      - path: Trilex/Resources
    dependencies:
      - package: TrilexKit
    info:
      path: Trilex/Info.plist
      properties:
        CFBundleDisplayName: Þríauga
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: Trilex
        PRODUCT_BUNDLE_IDENTIFIER: io.xiaodong.thriauga
        MARKETING_VERSION: 1.3.1
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets: []
